<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LectorPDF — Lee tus libros en PDF</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #2b2620;
    --muted: #7a7266;
    --accent: #8a5a44;
    --accent-dark: #6e4635;
    --border: #e2dccf;
    --shadow: 0 8px 24px rgba(43,38,32,0.12);
  }
  :root[data-theme="dark"] {
    --bg: #16151a;
    --panel: #201f26;
    --ink: #eae6de;
    --muted: #9b968c;
    --accent: #c98a63;
    --accent-dark: #a86c48;
    --border: #34323b;
    --shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Georgia", "Iowan Old Style", ui-serif, serif;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 18px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow);
    z-index: 5;
    flex-wrap: wrap;
  }
  .brand {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.02em;
    margin-right: 8px;
    white-space: nowrap;
  }
  .brand span { color: var(--accent); }

  button, .file-btn {
    font-family: inherit;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s, transform 0.05s;
  }
  button:hover:not(:disabled), .file-btn:hover { background: var(--border); }
  button:active:not(:disabled) { transform: scale(0.96); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-dark); }

  input[type="file"] { display: none; }

  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .spacer { flex: 1; }

  #pageInfo {
    font-size: 0.9rem;
    color: var(--muted);
    min-width: 88px;
    text-align: center;
  }
  #pageNum {
    width: 48px;
    text-align: center;
    font-family: inherit;
    padding: 6px 4px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
  }
  #zoomLevel { min-width: 48px; text-align: center; color: var(--muted); font-size: 0.85rem; }

  /* Main layout */
  #main {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  /* Sidebar */
  #sidebar {
    width: 200px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
    display: none;
  }
  #sidebar.open { display: block; }
  .thumb {
    padding: 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    text-align: center;
  }
  .thumb.active { background: var(--bg); }
  .thumb canvas {
    max-width: 100%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    border: 2px solid transparent;
  }
  .thumb.active canvas { border-color: var(--accent); }
  .thumb .num { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

  /* Viewer */
  #viewerWrap {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 30px 20px 60px;
    position: relative;
  }
  #viewer {
    background: var(--panel);
    box-shadow: var(--shadow);
    position: relative;
  }
  #viewer canvas { display: block; }
  #textLayer {
    position: absolute;
    left: 0; top: 0;
    overflow: hidden;
    opacity: 0.25;
    line-height: 1;
  }
  #textLayer span { position: absolute; white-space: pre; transform-origin: 0 0; color: transparent; }
  #textLayer ::selection { background: var(--accent); opacity: 0.4; }

  /* Drop zone / welcome */
  #welcome {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #dropzone {
    width: min(520px, 90vw);
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 48px 32px;
    text-align: center;
    background: var(--panel);
    box-shadow: var(--shadow);
    transition: border-color 0.15s, background 0.15s;
  }
  #dropzone.drag { border-color: var(--accent); background: var(--bg); }
  #dropzone h1 { margin: 0 0 8px; font-size: 1.5rem; }
  #dropzone p { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  #dropzone .icon { font-size: 3rem; margin-bottom: 12px; }

  /* Progress */
  #progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: var(--accent);
    width: 0%;
    transition: width 0.2s;
    z-index: 20;
  }

  #status {
    font-size: 0.85rem;
    color: var(--muted);
    padding: 0 4px;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }

  @media (max-width: 700px) {
    #sidebar { position: absolute; height: 100%; z-index: 10; }
    .brand { display: none; }
    #pageInfo { min-width: 60px; }
  }
</style>
</head>
<body>
<div id="progress"></div>
<div id="app">
  <header>
    <div class="brand">Lector<span>PDF</span></div>
    <div class="toolbar-group">
      <label class="file-btn" for="fileInput" title="Abrir un PDF">📂 Abrir</label>
      <input type="file" id="fileInput" accept="application/pdf" />
      <button id="toggleSidebar" title="Mostrar/ocultar miniaturas" disabled>🗂️</button>
    </div>
    <div class="toolbar-group">
      <button id="prevPage" disabled title="Página anterior">◀</button>
      <div id="pageInfo"><input id="pageNum" value="0" disabled /> / <span id="pageCount">0</span></div>
      <button id="nextPage" disabled title="Página siguiente">▶</button>
    </div>
    <div class="toolbar-group">
      <button id="zoomOut" disabled title="Alejar">−</button>
      <span id="zoomLevel">100%</span>
      <button id="zoomIn" disabled title="Acercar">+</button>
      <button id="fitWidth" disabled title="Ajustar al ancho">↔</button>
    </div>
    <div class="spacer"></div>
    <div id="status"></div>
    <div class="toolbar-group">
      <button id="themeToggle" title="Cambiar tema">🌙</button>
    </div>
  </header>

  <div id="main">
    <aside id="sidebar"></aside>

    <div id="welcome">
      <div id="dropzone">
        <div class="icon">📖</div>
        <h1>Lee tus libros en PDF</h1>
        <p>Arrastra un archivo PDF aquí o elige uno desde tu equipo. Todo se procesa en tu navegador — nada se sube a ningún servidor.</p>
        <label class="file-btn primary" for="fileInput2" style="justify-content:center; padding:10px 20px;">📂 Elegir archivo PDF</label>
        <input type="file" id="fileInput2" accept="application/pdf" />
      </div>
    </div>

    <div id="viewerWrap" style="display:none;">
      <div id="viewer">
        <canvas id="pdfCanvas"></canvas>
        <div id="textLayer"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id) => document.getElementById(id);
  const fileInput = $("fileInput");
  const fileInput2 = $("fileInput2");
  const dropzone = $("dropzone");
  const welcome = $("welcome");
  const viewerWrap = $("viewerWrap");
  const viewer = $("viewer");
  const canvas = $("pdfCanvas");
  const ctx = canvas.getContext("2d");
  const textLayerDiv = $("textLayer");
  const pageNumInput = $("pageNum");
  const pageCountSpan = $("pageCount");
  const prevBtn = $("prevPage");
  const nextBtn = $("nextPage");
  const zoomInBtn = $("zoomIn");
  const zoomOutBtn = $("zoomOut");
  const zoomLevelSpan = $("zoomLevel");
  const fitWidthBtn = $("fitWidth");
  const sidebar = $("sidebar");
  const toggleSidebarBtn = $("toggleSidebar");
  const statusEl = $("status");
  const progressBar = $("progress");
  const themeToggle = $("themeToggle");

  let pdfDoc = null;
  let currentPage = 1;
  let scale = 1.2;
  let renderTask = null;
  let currentFileName = "";
  const STORAGE_PREFIX = "lectorpdf:";

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
    localStorage.setItem(STORAGE_PREFIX + "theme", theme);
  }
  const savedTheme = localStorage.getItem(STORAGE_PREFIX + "theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(savedTheme);
  themeToggle.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // ---------- File loading ----------
  function handleFile(file) {
    if (!file || file.type !== "application/pdf") return;
    currentFileName = file.name;
    const reader = new FileReader();
    statusEl.textContent = "Cargando \"" + file.name + "\"…";
    reader.onload = function (e) {
      loadPdf(new Uint8Array(e.target.result));
    };
    reader.readAsArrayBuffer(file);
  }

  function loadPdf(data) {
    progressBar.style.width = "10%";
    const loadingTask = pdfjsLib.getDocument({ data });
    loadingTask.onProgress = function (p) {
      if (p.total) progressBar.style.width = Math.max(10, (p.loaded / p.total) * 100) + "%";
    };
    loadingTask.promise.then(function (doc) {
      pdfDoc = doc;
      progressBar.style.width = "100%";
      setTimeout(() => (progressBar.style.width = "0%"), 400);

      welcome.style.display = "none";
      viewerWrap.style.display = "flex";
      pageCountSpan.textContent = doc.numPages;
      pageNumInput.disabled = false;
      prevBtn.disabled = false;
      nextBtn.disabled = false;
      zoomInBtn.disabled = false;
      zoomOutBtn.disabled = false;
      fitWidthBtn.disabled = false;
      toggleSidebarBtn.disabled = false;
      statusEl.textContent = currentFileName + " — " + doc.numPages + " páginas";

      const savedPage = parseInt(localStorage.getItem(STORAGE_PREFIX + "page:" + currentFileName) || "1", 10);
      currentPage = Math.min(Math.max(savedPage, 1), doc.numPages);

      renderPage(currentPage);
      buildThumbnails();
    }).catch(function (err) {
      statusEl.textContent = "Error al abrir el PDF: " + err.message;
      progressBar.style.width = "0%";
    });
  }

  // ---------- Rendering ----------
  function renderPage(num) {
    if (!pdfDoc) return;
    if (renderTask) {
      renderTask.cancel();
    }
    pdfDoc.getPage(num).then(function (page) {
      const viewport = page.getViewport({ scale: scale });
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      viewer.style.width = viewport.width + "px";
      viewer.style.height = viewport.height + "px";
      textLayerDiv.style.width = viewport.width + "px";
      textLayerDiv.style.height = viewport.height + "px";
      textLayerDiv.innerHTML = "";

      const task = page.render({ canvasContext: ctx, viewport: viewport });
      renderTask = task;
      task.promise.then(function () {
        renderTask = null;
        return page.getTextContent();
      }).then(function (textContent) {
        pdfjsLib.renderTextLayer({
          textContent: textContent,
          container: textLayerDiv,
          viewport: viewport,
          textDivs: []
        });
      }).catch(function (err) {
        if (err && err.name !== "RenderingCancelledException") {
          console.error(err);
        }
      });

      currentPage = num;
      pageNumInput.value = num;
      prevBtn.disabled = num <= 1;
      nextBtn.disabled = num >= pdfDoc.numPages;
      zoomLevelSpan.textContent = Math.round((scale / 1.2) * 100) + "%";
      if (currentFileName) {
        localStorage.setItem(STORAGE_PREFIX + "page:" + currentFileName, String(num));
      }
      highlightThumb(num);
    });
  }

  function buildThumbnails() {
    sidebar.innerHTML = "";
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const wrap = document.createElement("div");
      wrap.className = "thumb";
      wrap.dataset.page = i;
      const c = document.createElement("canvas");
      const label = document.createElement("div");
      label.className = "num";
      label.textContent = i;
      wrap.appendChild(c);
      wrap.appendChild(label);
      wrap.addEventListener("click", () => renderPage(i));
      sidebar.appendChild(wrap);

      pdfDoc.getPage(i).then(function (page) {
        const vp = page.getViewport({ scale: 0.18 });
        c.width = vp.width;
        c.height = vp.height;
        page.render({ canvasContext: c.getContext("2d"), viewport: vp });
      });
    }
    highlightThumb(currentPage);
  }

  function highlightThumb(num) {
    const active = sidebar.querySelector(".thumb.active");
    if (active) active.classList.remove("active");
    const el = sidebar.querySelector('.thumb[data-page="' + num + '"]');
    if (el) {
      el.classList.add("active");
      el.scrollIntoView({ block: "nearest" });
    }
  }

  // ---------- Controls ----------
  prevBtn.addEventListener("click", () => { if (currentPage > 1) renderPage(currentPage - 1); });
  nextBtn.addEventListener("click", () => { if (currentPage < pdfDoc.numPages) renderPage(currentPage + 1); });

  pageNumInput.addEventListener("change", () => {
    let n = parseInt(pageNumInput.value, 10);
    if (!pdfDoc || isNaN(n)) return;
    n = Math.min(Math.max(n, 1), pdfDoc.numPages);
    renderPage(n);
  });

  zoomInBtn.addEventListener("click", () => { scale = Math.min(scale + 0.2, 4); renderPage(currentPage); });
  zoomOutBtn.addEventListener("click", () => { scale = Math.max(scale - 0.2, 0.4); renderPage(currentPage); });
  fitWidthBtn.addEventListener("click", () => {
    if (!pdfDoc) return;
    pdfDoc.getPage(currentPage).then(function (page) {
      const vp = page.getViewport({ scale: 1 });
      const available = viewerWrap.clientWidth - 60;
      scale = available / vp.width;
      renderPage(currentPage);
    });
  });

  toggleSidebarBtn.addEventListener("click", () => sidebar.classList.toggle("open"));

  document.addEventListener("keydown", (e) => {
    if (!pdfDoc) return;
    if (document.activeElement === pageNumInput) return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); if (currentPage < pdfDoc.numPages) renderPage(currentPage + 1); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); if (currentPage > 1) renderPage(currentPage - 1); }
    if (e.key === "+" || e.key === "=") zoomInBtn.click();
    if (e.key === "-") zoomOutBtn.click();
  });

  fileInput.addEventListener("change", (e) => handleFile(e.target.files[0]));
  fileInput2.addEventListener("change", (e) => handleFile(e.target.files[0]));

  ["dragenter", "dragover"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach((evt) =>
    dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", (e) => {
    const file = e.dataTransfer.files[0];
    handleFile(file);
  });

  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!pdfDoc && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
})();
</script>
</body>
</html>
